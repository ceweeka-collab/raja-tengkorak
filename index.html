<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raja Tengkorak</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #181412;
            --panel-border: #2d241e;
            --accent-orange: #e66722;
            --accent-gold: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            border: 1px solid var(--panel-border);
        }

        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 16px;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
        }

        /* TOP BAR / HEADER */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            margin-bottom: 12px;
            font-size: 13px;
        }

        .info-pill {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .btn-exit {
            background: #991b1b;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* LOGIN SCREEN */
        #login-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #26160c 0%, #050505 100%);
        }

        .brand-title {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-orange);
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(230, 103, 34, 0.4);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            margin: 20px 0 12px 0;
            outline: none;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: var(--accent-orange);
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e66722, #c2410c);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(230, 103, 34, 0.3);
        }

        /* LOBBY SCREEN */
        .lobby-title {
            color: var(--accent-orange);
            font-size: 18px;
            margin-bottom: 12px;
            text-align: center;
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0;
        }

        .room-item {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-item h4 {
            font-size: 15px;
            color: var(--text-main);
        }

        .room-item p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn-join {
            background: var(--accent-orange);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        /* ARENA PLAYERS */
        .players-arena {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .player-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
        }

        .player-card .p-tag {
            font-size: 11px;
            color: var(--accent-gold);
            font-weight: bold;
            background: rgba(245, 158, 11, 0.1);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 4px;
        }

        .player-card .p-name {
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-card .p-sub {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* PANEL TENGAH */
        .center-stage {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .stage-title {
            color: var(--accent-orange);
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .target-banner {
            background: #0d0d0d;
            border: 1px solid var(--panel-border);
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .target-banner span {
            color: var(--accent-gold);
            font-weight: bold;
        }

        /* TANGAN KARTU KREM */
        .card-hand {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 20px 5px 10px 5px;
            overflow-x: auto;
            min-height: 120px;
        }

        .card-item {
            margin-left: -32px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }

        .card-item:first-child {
            margin-left: 0;
        }

        .card-item.selected {
            transform: translateY(-22px) scale(1.05);
            z-index: 50 !important;
        }

        .card-item.selected .playing-card {
            border: 2px solid #22c55e;
            box-shadow: 0 0 14px rgba(34, 197, 94, 0.8), 0 8px 16px rgba(0,0,0,0.6);
        }

        /* DESAIN KARTU KREM PRESISI */
        .playing-card {
            width: 65px;
            height: 98px;
            background-color: #fdfbf7;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            box-sizing: border-box;
            user-select: none;
            font-family: Arial, sans-serif;
        }

        .playing-card.red { color: #dc2626; }
        .playing-card.black { color: #0f172a; }

        .card-corner-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: max-content;
            line-height: 0.85;
            font-weight: 800;
            font-size: 12px;
        }

        .card-corner-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: max-content;
            line-height: 0.85;
            font-weight: 800;
            font-size: 12px;
            align-self: flex-end;
            transform: rotate(180deg);
        }

        .card-center-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- SCREEN 1: LOGIN -->
    <div id="login-screen" class="screen active">
        <div style="font-size: 54px; margin-bottom: 10px;">☠️</div>
        <div class="brand-title">RAJA TENGKORAK</div>
        <p style="color: var(--text-muted); font-size: 13px;">Game Kartu Bantaian Online</p>

        <input type="text" id="username-input" placeholder="Masukkan Username Anda..." maxlength="15" />
        <button class="btn-main" onclick="login()">MASUK LOBBY</button>
    </div>

    <!-- SCREEN 2: LOBBY -->
    <div id="lobby-screen" class="screen">
        <div class="top-bar">
            <div>Player: <span class="info-pill" id="player-badge">User</span></div>
            <button class="btn-exit" onclick="logout()">Logout</button>
        </div>

        <div class="lobby-title">DAFTAR ROOM AKTIF</div>
        <button class="btn-main" onclick="createRoom()">+ BUAT ROOM BARU</button>

        <div class="room-list" id="room-list-container"></div>
    </div>

    <!-- SCREEN 3: GAME ARENA -->
    <div id="game-screen" class="screen">
        <div class="top-bar">
            <div id="room-title-display">Ronde 1/6</div>
            <div class="info-pill">Truf: ♣</div>
            <button class="btn-exit" onclick="leaveRoom()">Keluar</button>
        </div>

        <div class="players-arena">
            <div class="player-card">
                <div class="p-tag">P2</div>
                <div class="p-name" id="p2-name">Kosong</div>
                <div class="p-sub">Skor: 0</div>
            </div>
            <div class="player-card">
                <div class="p-tag">P3</div>
                <div class="p-name" id="p3-name">Kosong</div>
                <div class="p-sub">Skor: 0</div>
            </div>
            <div class="player-card">
                <div class="p-tag">P4</div>
                <div class="p-name" id="p4-name">Kosong</div>
                <div class="p-sub">Skor: 0</div>
            </div>
        </div>

        <div class="center-stage">
            <div class="stage-title">PILIH TARGET BID</div>
            <div class="target-banner">
                Hasil Target: <span>Target: 4 (Truf: ♣)</span>
            </div>

            <div class="card-hand" id="player-hand-container"></div>

            <button class="btn-main" style="margin-top: 15px;" onclick="confirmCard()">Konfirmasi Target</button>
        </div>
    </div>

</div>

<script>
    let state = {
        user: null,
        currentRoomId: null,
        rooms: []
    };

    function loadSavedSession() {
        const savedUser = localStorage.getItem('rt_user');
        const savedRoom = localStorage.getItem('rt_active_room');
        const savedRoomsData = localStorage.getItem('rt_rooms_db');

        if (savedRoomsData) {
            try { state.rooms = JSON.parse(savedRoomsData); } catch(e) { state.rooms = []; }
        }

        if (savedUser) {
            state.user = savedUser;
            document.getElementById('player-badge').innerText = savedUser;

            if (savedRoom) {
                state.currentRoomId = savedRoom;
                showScreen('game-screen');
                initGameRoom(savedRoom);
            } else {
                showScreen('lobby-screen');
                renderRooms();
            }
        } else {
            showScreen('login-screen');
        }
    }

    function saveRoomsToStorage() {
        localStorage.setItem('rt_rooms_db', JSON.stringify(state.rooms));
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function login() {
        const input = document.getElementById('username-input').value.trim();
        if (!input) return alert('Silakan masukkan username Anda!');
        
        state.user = input;
        localStorage.setItem('rt_user', input);
        document.getElementById('player-badge').innerText = input;
        showScreen('lobby-screen');
        renderRooms();
    }

    function logout() {
        localStorage.clear();
        state.user = null;
        state.currentRoomId = null;
        showScreen('login-screen');
    }

    function renderRooms() {
        const container = document.getElementById('room-list-container');
        container.innerHTML = '';

        state.rooms = state.rooms.filter(r => r.players > 0);
        saveRoomsToStorage();

        if (state.rooms.length === 0) {
            container.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin-top:20px; font-style:italic;">Belum ada room aktif.<br>Buat room baru sekarang!</p>';
            return;
        }

        state.rooms.forEach(room => {
            container.innerHTML += `
                <div class="room-item">
                    <div>
                        <h4>${room.name}</h4>
                        <p>${room.players}/4 Player</p>
                    </div>
                    <button class="btn-join" onclick="joinRoom('${room.id}')">MASUK</button>
                </div>
            `;
        });
    }

    function createRoom() {
        const roomId = 'room_' + Date.now();
        const newRoom = {
            id: roomId,
            name: 'Room ' + state.user,
            players: 1,
            members: [state.user]
        };

        state.rooms.push(newRoom);
        saveRoomsToStorage();
        enterRoom(roomId);
    }

    function joinRoom(roomId) {
        const room = state.rooms.find(r => r.id === roomId);
        if (room && room.players < 4) {
            if (!room.members.includes(state.user)) {
                room.members.push(state.user);
                room.players = room.members.length;
                saveRoomsToStorage();
            }
            enterRoom(roomId);
        } else {
            alert('Room penuh atau tidak ada!');
        }
    }

    function enterRoom(roomId) {
        state.currentRoomId = roomId;
        localStorage.setItem('rt_active_room', roomId);
        showScreen('game-screen');
        initGameRoom(roomId);
    }

    function leaveRoom() {
        if (state.currentRoomId) {
            const room = state.rooms.find(r => r.id === state.currentRoomId);
            if (room) {
                room.members = room.members.filter(m => m !== state.user);
                room.players = room.members.length;
                saveRoomsToStorage();
            }
        }

        state.currentRoomId = null;
        localStorage.removeItem('rt_active_room');
        showScreen('lobby-screen');
        renderRooms();
    }

    function initGameRoom(roomId) {
        const room = state.rooms.find(r => r.id === roomId) || { name: 'ARENA', members: [state.user] };
        document.getElementById('room-title-display').innerText = room.name.toUpperCase();

        const others = room.members.filter(m => m !== state.user);
        document.getElementById('p2-name').innerText = others[0] || 'Kosong';
        document.getElementById('p3-name').innerText = others[1] || 'Kosong';
        document.getElementById('p4-name').innerText = others[2] || 'Kosong';

        renderHand();
    }

    function renderHand() {
        const container = document.getElementById('player-hand-container');
        const cards = [
            { val: '4', sym: '♣', color: 'black' },
            { val: '9', sym: '♥', color: 'red' },
            { val: 'A', sym: '♦', color: 'red' },
            { val: 'J', sym: '♠', color: 'black' },
            { val: 'K', sym: '♠', color: 'black' }
        ];

        container.innerHTML = cards.map(c => `
            <div class="card-item" onclick="selectCard(this)">
                <div class="playing-card ${c.color}">
                    <div class="card-corner-top">
                        <span>${c.val}</span>
                        <span style="font-size:10px;">${c.sym}</span>
                    </div>
                    <div class="card-center-icon">${c.sym}</div>
                    <div class="card-corner-bottom">
                        <span>${c.val}</span>
                        <span style="font-size:10px;">${c.sym}</span>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function selectCard(element) {
        document.querySelectorAll('.card-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
    }

    function confirmCard() {
        const selected = document.querySelector('.card-item.selected');
        if (!selected) return alert('Pilih salah satu kartu terlebih dahulu!');
        alert('Target berhasil dikonfirmasi!');
    }

    window.onload = loadSavedSession;
</script>
</body>
</html>
